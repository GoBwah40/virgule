name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, knip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version de pnpm lue dans le champ `packageManager` du package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Même version majeure que le runtime Vercel du projet.
          node-version: 24
          cache: pnpm

      # Le postinstall génère le client Prisma (aucune base nécessaire).
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build Storybook
        run: pnpm build-storybook --quiet
