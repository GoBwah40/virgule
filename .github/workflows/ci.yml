name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new run on the same branch cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, knip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version read from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Same major version as the project's Vercel runtime.
          node-version: 24
          cache: pnpm

      # postinstall generates the Prisma client (no database needed).
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build Storybook
        run: pnpm build-storybook --quiet
