name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new run on the same branch cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, knip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version read from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Same major version as the project's Vercel runtime.
          node-version: 24
          cache: pnpm

      # postinstall generates the Prisma client (no database needed).
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Build Storybook
        run: pnpm build-storybook --quiet

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version read from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browsers are tied to the Playwright version: the cache key follows it.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The cache only holds the browser, not its system libraries.
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Starts the app itself (see playwright.config.ts), on a throwaway SQLite database.
      - run: pnpm test:e2e

      # Traces of the failed tests: open them with `pnpm exec playwright show-trace <zip>`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
