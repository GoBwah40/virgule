name: Deploy to production

# Production is deployed from version tags only (pushes to `main` are
# ignored by Vercel, see `git.deploymentEnabled` in vercel.json).
on:
  push:
    tags: ["v*"]

# A newer tag cancels a deployment still in progress.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the latest tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag and `main`, to compare against them.
          fetch-depth: 0

      # Only the highest version goes to production: pushing an older tag
      # (for example when backfilling the history) deploys nothing.
      - name: Check the tag
        id: tag
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ "$GITHUB_REF_NAME" != "$latest" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the latest tag ($latest), nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit of main."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match the package.json version ($version)."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # Vercel builds the uploaded sources itself, as for a Git deployment.
      - name: Deploy on Vercel
        if: steps.tag.outputs.deploy == 'true'
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
