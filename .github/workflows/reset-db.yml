name: Reset database

# Manual only: Actions tab → "Reset database" → Run workflow.
# Deletes every session (participants, topics, ideas, votes) from the chosen Turso
# database; the schema and the migration history are kept.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Database to empty
        type: choice
        options: [virgule-preview, virgule]
        default: virgule-preview
      confirm:
        description: Type the database name again to confirm
        type: string
        required: true

concurrency:
  group: reset-db-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    name: Empty ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub environment holding this database's TURSO_DATABASE_URL and TURSO_AUTH_TOKEN
    # (add required reviewers on `production` for an extra approval step).
    environment: ${{ inputs.target == 'virgule' && 'production' || 'preview' }}
    steps:
      - name: Check the confirmation
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$TARGET" ]; then
            echo "::error::Confirmation \"$CONFIRM\" does not match \"$TARGET\": nothing was deleted."
            exit 1
          fi

      - uses: actions/checkout@v7

      # pnpm version read from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Empty the database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESET_CONFIRM: "yes"
        run: pnpm db:reset:remote
